<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictation Simulator</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<script src="audio-human/human.js"></script>
<style>
:root{
  --bg:#f6f5f1; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e1da; --chip:#f0eee8;
  --accent:#b4232a; --accent-ink:#fff; --ok:#1f7a3f; --ok-bg:#e6f4ea; --bad:#b3261e; --bad-bg:#fbe9e7; --warn-bg:#fff4d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151517; --panel:#1f1f22; --ink:#ececee; --muted:#9a9aa1; --line:#33333a; --chip:#2a2a2f;
    --accent:#e5484d; --accent-ink:#fff; --ok:#4cc38a; --ok-bg:#16301f; --bad:#ff6b5e; --bad-bg:#3a1b18; --warn-bg:#3a3115;
  }
}
:root[data-theme="dark"]{
  --bg:#151517; --panel:#1f1f22; --ink:#ececee; --muted:#9a9aa1; --line:#33333a; --chip:#2a2a2f;
  --accent:#e5484d; --accent-ink:#fff; --ok:#4cc38a; --ok-bg:#16301f; --bad:#ff6b5e; --bad-bg:#3a1b18; --warn-bg:#3a3115;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:16px;margin:0;font-weight:650}
nav{display:flex;gap:4px}
nav button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
.settings{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto;font-size:13px;color:var(--muted)}
.settings select,.settings input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;height:calc(100vh - 58px)}
body.nobook .wrap{grid-template-columns:minmax(0,1fr)}
body.nobook .book{display:none}
.main,.book{overflow:auto;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}
button.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
button.btn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:14px;line-height:1.3;text-align:center}
.chip:hover{border-color:var(--muted)}
.chip .hz{display:block;font-size:12px;color:var(--muted)}
.chip.key{border-color:var(--accent)}
.rules li{margin:3px 0}
.rules b{color:var(--accent)}
.plan label{display:flex;gap:8px;align-items:flex-start;margin:5px 0}
.plan input{margin-top:4px}
.plan .t{font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px}
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;margin:8px 0 12px}
.drill{text-align:center;padding:26px 16px}
.drill .count{color:var(--muted);font-size:13px}
.drill .task{margin:6px 0 14px;font-weight:600}
.drill input.ans{font-size:24px;text-align:center;width:min(420px,100%);padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.drill input.ans:focus{outline:none;border-color:var(--accent)}
.answer{margin-top:16px;padding:14px;border-radius:10px}
.answer.ok{background:var(--ok-bg)} .answer.bad{background:var(--bad-bg)} .answer.pending{background:var(--warn-bg)}
.answer .py{font-size:34px;font-weight:600;letter-spacing:.5px}
.answer .hzbig{font-size:30px}
.verdict{font-weight:700;margin-bottom:4px}
.ok .verdict{color:var(--ok)} .bad .verdict{color:var(--bad)}
.keys{font-size:12px;color:var(--muted);margin-top:12px}
kbd{font:12px ui-monospace,Menlo,monospace;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
td.mark{cursor:pointer;font-weight:700;text-align:center;width:52px}
td.mark.y{color:var(--ok)} td.mark.n{color:var(--bad)}
.score{font-size:40px;font-weight:700}
.hw{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:8px auto 0}
.book .tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);padding-bottom:8px;z-index:2}
.book img{width:100%;display:block;border-radius:8px;border:1px solid var(--line);background:#fff}
.book iframe{width:100%;height:calc(100vh - 150px);display:block;border:1px solid var(--line);border-radius:8px;background:#fff}
.book .imgbox{position:relative}
body.mocking .book .imgbox::after{content:"Book hidden during the mock test";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-weight:600;border-radius:8px}
.warn{background:var(--warn-bg);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:10px auto 0;width:min(420px,100%)}
.bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);height:auto;padding:12px 16px}
  .book{height:75vh}
  .settings{margin-left:0}
}
</style>
</head>
<body>
<header>
  <h1>听写 Dictation · Mon 19 Oct</h1>
  <nav id="nav">
    <button data-tab="study" class="on">Study</button>
    <button data-tab="tones">Tones</button>
    <button data-tab="practice">Practice</button>
    <button data-tab="mock">Mock test</button>
    <button data-tab="errors">Errors <span id="errCount"></span></button>
  </nav>
  <div class="settings">
    <label>Voice <select id="voice"></select></label>
    <label>Speed <input id="rate" type="range" min="0.5" max="1.2" step="0.05" style="width:80px"></label>
    <label>Reads <select id="reps"><option value="1">1×</option><option value="2">2×</option></select></label>
    <label><input id="showBook" type="checkbox" checked> Book</label>
  </div>
</header>

<div class="wrap">
  <main class="main" id="main"></main>
  <aside class="book">
    <div class="tabs" id="bookTabs"></div>
    <div class="imgbox" id="bookBox"></div>
  </aside>
</div>

<script>
/* ---------- data: 汉语教程(第3版) 1A, verified against the book pages ---------- */
// item: [numbered pinyin, characters (for the voice / L1 answer), book page, key-answer flag]
const SECTIONS = [
  {id:'l1comm', name:'L1 · Communication (p.12)', task:'Write 汉字 + pinyin', chars:true, items:[['ni3 hao3','你好',12,1]]},
  {id:'l1char', name:'L1 · Characters (p.12–13)', task:'Write 汉字 + pinyin', chars:true, items:[
    ['yi1','一',12],['ba1','八',12],['wu3','五',12],['bu4','不',12],['da4','大',12],['kou3','口',12],['bai2','白',12],
    ['nü3','女',13],['ni3','你',13],['hao3','好',13],['ma3','马',13]]},
  {id:'ex1', name:'L3 Ex 1 · Tones (p.26–27)', task:'Write the pinyin with its tone', items:[
    ['xue1','靴',26],['xue2','学',26,1],['xue3','雪',26],['xue4','谑',26],
    ['qu1','区',26],['qu2','渠',26],['qu3','取',26,1],['qu4','去',26,1],
    ['ju1','居',26],['ju2','局',26,1],['ju3','举',26],['ju4','句',26],
    ['qian1','千',26],['qian2','钱',26,1],['qian3','浅',26],['qian4','欠',26],
    ['liu1','溜',26],['liu2','刘',26],['liu3','柳',26],['liu4','六',26,1],
    ['qi1','七',26,1],['qi2','骑',26],['qi3','起',26],['qi4','气',26],
    ['jiu1','揪',27],['jiu3','九',27,1],['jiu4','就',27],
    ['ming2','明',27,1],['ming3','酩',27],['ming4','命',27],
    ['tian1','天',27,1],['tian2','甜',27],['tian3','舔',27],['tian4','掭',27],
    ['jian1','尖',27],['jian3','减',27],['jian4','见',27,1]]},
  {id:'ex2', name:'L3 Ex 2 · 不 sandhi (p.27)', task:'Write the pinyin (bù or bú?)', items:[
    ['bu4 he1','不喝',27],['bu4 ting1','不听',27],['bu4 ban1','不搬',27],['bu4 xin1','不新',27],
    ['bu4 mang2','不忙',27],['bu4 xue2','不学',27],['bu4 tian2','不甜',27],['bu4 xing2','不行',27],
    ['bu4 hao3','不好',27],['bu4 dong3','不懂',27],['bu4 jiang3','不讲',27],['bu4 qing3','不请',27],
    ['bu2 yao4','不要',27,1],['bu2 kan4','不看',27,1],['bu2 nian4','不念',27,1],['bu2 jin4','不进',27,1]]},
  {id:'ex3s', name:'L3 Ex 3 · Syllables (p.27)', task:'Write the pinyin with its tone', items:[
    ['ji1','鸡'],['qi1','七'],['xi1','吸'],['ju1','居'],['qu1','区'],['xu1','虚'],
    ['jian1','肩'],['qian1','千'],['xian1','先'],['jiang1','江'],['qiang1','枪'],['xiang1','香'],
    ['jin1','金'],['qin1','亲'],['xin1','心'],['jing1','京'],['qing1','轻'],['xing1','猩'],
    ['jian4','件'],['juan4','倦'],['qian2','钱'],['quan2','全'],['xian3','险'],['xuan3','选'],
    ['jin1','今'],['jun1','军'],['qin2','琴'],['qun2','群'],['xin1','新'],['xun1','熏'],
    ['ji2','急'],['ju2','局'],['qi3','起'],['qu3','取'],['xi1','西'],['xu1','需'],
    ['jia1','家'],['xia4','下'],['qing1','青'],['xing1','星'],['jiang3','讲'],['qiang2','墙'],
    ['jiao4','叫'],['xiao4','笑'],['qiu2','球'],['xiu1','修'],['jie4','借'],['qie4','窃'],
    ['jie3','姐'],['xie3','写'],['qiao2','桥'],['xiao3','小'],['jing3','井'],['qing3','请']]},
  {id:'ex3w', name:'L3 Ex 3 · Words (p.27)', task:'Write the pinyin with its tones', items:[
    ['ji1qi4','机器'],['ju3 qi2','举旗'],['xiu1xi5','休息'],['xiu1li3','修理'],
    ['ju3xing2','举行'],['ju4xing2','句型'],['xu1yao4','需要'],['xi1yao4','西药'],
    ['nu3li4','努力'],['lü3li4','履历'],['qu3 qian2','取钱'],['ti2qian2','提前'],
    ['jin1tian1','今天'],['ming2tian1','明天'],['jin1nian2','今年'],['ming2nian2','明年'],
    ['quan2xian4','权限'],['quan2mian4','全面'],['xin1xian1','新鲜'],['xin1nian2','新年'],
    ['dong1bian5','东边'],['xi1bian5','西边'],['qian2bian5','前边'],['hou4bian5','后边']]},
];
// English meanings: L1, the Ex 1 answer words, Ex 2 and the Ex 3 words (Ex 3 single syllables are sound drills only)
const MEAN = {
  '你好':'hello', '一':'one', '八':'eight', '五':'five', '不':'not, no', '大':'big', '口':'mouth', '白':'white',
  '女':'woman, female', '你':'you', '好':'good', '马':'horse',
  '学':'study', '取':'take, fetch', '去':'go', '局':'office (as in 邮局 post office)', '钱':'money', '六':'six', '七':'seven',
  '九':'nine', '明':'bright (明天 tomorrow)', '天':'day, sky', '见':'see',
  '不喝':'not drink', '不听':'not listen', '不搬':'not move (house)', '不新':'not new', '不忙':'not busy', '不学':'not study',
  '不甜':'not sweet', '不行':'no way, won\'t do', '不好':'not good', '不懂':'not understand', '不讲':'not speak', '不请':'not invite',
  '不要':'don\'t want', '不看':'not look, not read', '不念':'not read aloud', '不进':'not enter',
  '不难':'not hard', '不高':'not tall', '不来':'not come', '不小':'not small', '不去':'not go', '不谢':'you\'re welcome',
  '机器':'machine', '举旗':'raise a flag', '休息':'rest', '修理':'repair', '举行':'hold (an event)', '句型':'sentence pattern',
  '需要':'need', '西药':'western medicine', '努力':'work hard', '履历':'résumé', '取钱':'withdraw money', '提前':'in advance',
  '今天':'today', '明天':'tomorrow', '今年':'this year', '明年':'next year', '权限':'authority, permission', '全面':'comprehensive',
  '新鲜':'fresh', '新年':'new year', '东边':'east side', '西边':'west side', '前边':'front', '后边':'back, behind',
};
const ITEMS = [];
for (const s of SECTIONS) for (const [py, hz, page, key] of s.items)
  ITEMS.push({id:s.id+':'+py+':'+hz, sec:s.id, py, hz, en:(s.id === 'ex3s' ? '' : MEAN[hz] || ''), page:page||27, key:!!key, chars:!!s.chars, task:s.task});
const bySec = id => ITEMS.filter(i => i.sec === id);

/* ---------- pinyin ---------- */
const MARKS = {a:'āáǎà', e:'ēéěè', i:'īíǐì', o:'ōóǒò', u:'ūúǔù', 'ü':'ǖǘǚǜ'};
function markSyl(s, t){
  if (!(t >= 1 && t <= 4)) return s;
  let k = s.indexOf('a');
  if (k < 0) k = s.indexOf('e');
  if (k < 0 && s.includes('ou')) k = s.indexOf('o');
  if (k < 0) for (let j = s.length - 1; j >= 0; j--) if ('iouü'.includes(s[j])) { k = j; break; }
  return k < 0 ? s : s.slice(0, k) + MARKS[s[k]][t - 1] + s.slice(k + 1);
}
// accepts tone marks or numbers (ni3 hao3, nv3, nu:3, xiu1xi / xiu1xi5)
const toMarks = str => str.normalize('NFC').toLowerCase().replace(/u:/g, 'ü').replace(/v/g, 'ü')
  .replace(/([a-zü]+)([0-5])/g, (m, s, t) => markSyl(s, +t));
const norm = str => toMarks(str).replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùüǖǘǚǜ]/g, '');
const strip = str => str.normalize('NFD').replace(/[\u0300\u0301\u0304\u030c]/g, '').normalize('NFC');
const toneSeq = str => [...str].map(c => { for (const v in MARKS) { const k = MARKS[v].indexOf(c); if (k >= 0) return k + 1; } return 0; }).filter(Boolean).join('');
const show = it => toMarks(it.py);

function diagnose(inp, ans){
  const a = strip(ans), b = strip(inp);
  if (a === b) {
    if (/^bú/.test(ans) && /^bù/.test(inp)) return '不 before a 4th tone becomes bú.';
    if (/^bù/.test(ans) && /^bú/.test(inp)) return '不 stays bù before 1st, 2nd and 3rd tones. Only a 4th tone flips it to bú.';
    if (ans === 'nǐhǎo' && inp.startsWith('ní')) return 'Write nǐ hǎo. 3rd + 3rd is only spoken ní hǎo.';
    const ta = toneSeq(ans), tb = toneSeq(inp);
    if (ta === tb) return 'Tone mark on the wrong vowel: a first, else o/e, else the last of iu/ui.';
    if (tb.length > ta.length) return 'Neutral tone: …bian and the xi of xiūxi carry no mark.';
    if (tb.length < ta.length) return 'A tone mark is missing.';
    return 'Right letters, wrong tone. Replay it and trace the pitch with your hand.';
  }
  const u = x => x.replace(/ü/g, 'u');
  if (u(a) === u(b)) return /ü/.test(a) ? 'After n / l keep the dots: nǚ, lǚlì.' : 'After j, q, x the ü is written u: jū, qù, xuǎn, jūn.';
  if (a === b.replace(/iou/g, 'iu') || a === b.replace(/uei/g, 'ui')) return 'iou is written iu after an initial (liù, jiǔ).';
  if (a.replace(/ng/g, 'n') === b.replace(/ng/g, 'n')) return '-n vs -ng: jīn/jīng, xīn/xīng, qín/qīng, jiān/jiāng.';
  const jqx = x => x.replace(/[qx]/g, 'j');
  if (jqx(a) === jqx(b)) return 'j / q / x mix-up: q is j with a puff of air; x is a smiling "sh".';
  return 'Spelling differs. Compare letter by letter.';
}
// returns {ok: true|false|null, msg}
function grade(it, raw){
  const typed = raw.trim();
  const cjk = (typed.match(/[\u4e00-\u9fff]/g) || []).join('');
  const pyIn = norm(typed), pyAns = norm(it.py);
  if (!pyIn && !cjk) return {ok:null, msg:'Nothing typed. Mark yourself against your paper.'};
  if (cjk && cjk !== it.hz) return {ok:false, msg:`Character: you typed ${cjk}, the answer is ${it.hz}.`};
  if (!pyIn) return {ok: it.chars ? true : null, msg:'Character right. Check the pinyin on your paper too.'};
  if (pyIn !== pyAns) return {ok:false, msg:diagnose(pyIn, pyAns), yours:toMarks(typed)};
  if (it.chars && !cjk) return {ok:true, msg:'Pinyin right. Now check the 汉字 on your paper (press X if it was wrong).'};
  return {ok:true, msg:''};
}

/* ---------- storage (best effort) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('dict1019.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('dict1019.' + k, JSON.stringify(v)); } catch {} }
};
const S = Object.assign({rate:0.8, reps:2, gap:12, voice:'', book:true, secs:['l1comm','l1char','ex1','ex2','ex3s','ex3w']}, store.get('settings', {}));
const saveS = () => store.set('settings', S);
let bank = store.get('errors', {});  // id -> {miss, streak}
const saveBank = () => { store.set('errors', bank); document.getElementById('errCount').textContent = Object.keys(bank).length ? `(${Object.keys(bank).length})` : ''; };
function noteResult(it, ok){
  const e = bank[it.id];
  if (!ok) bank[it.id] = {miss:(e ? e.miss : 0) + 1, streak:0};
  else if (e) { e.streak++; if (e.streak >= 2) delete bank[it.id]; }
  saveBank();
}

/* ---------- speech ---------- */
let voices = [], voice = null, speakTok = 0;
function loadVoices(){
  voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /^zh[-_](CN|Hans)/i.test(v.lang) || /普通话|Mandarin|Tingting|Ting-Ting/i.test(v.name));
  const sel = document.getElementById('voice');
  sel.innerHTML = '<option value="human">Native speakers</option><option value="rec">AI voice (Xiaoxiao)</option>' + voices.map((v, i) => `<option value="${i}">${v.name} (Mac)</option>`).join('');
  if (S.audioV !== 2) { S.audioV = 2; if (!voices.some(v => v.name === S.voice)) S.voice = 'human'; saveS(); }
  const k = voices.findIndex(v => v.name === S.voice);
  sel.value = k >= 0 ? String(k) : (S.voice === 'rec' ? 'rec' : 'human'); voice = voices[k] || null;
  if (k < 0 && S.voice !== 'rec') S.voice = 'human';
}
let player = null;
// AI voice clips (audio/) and native-speaker clips (audio-human/, listed in human.js; words are one clip or a syllable sequence)
const audioFile = t => 'audio/' + [...t].map(c => c.codePointAt(0).toString(16)).join('_') + '.mp3';
const humanFiles = t => (typeof HUMAN !== 'undefined' && HUMAN[t]) ? HUMAN[t].map(f => 'audio-human/' + encodeURIComponent(f)) : null;
function playFiles(urls, times, rate, tok){
  return new Promise(res => {
    const once = n => {
      const step = k => {
        if (tok !== speakTok) return res(false);
        if (k >= urls.length) return n > 1 ? setTimeout(() => once(n - 1), 1100) : res(true);
        const a = player = new Audio(urls[k]);
        a.preservesPitch = true; a.playbackRate = Math.min(1.6, Math.max(0.5, rate / 0.8));
        let done = false;
        const fin = ok => { if (done) return; done = true; ok ? setTimeout(() => step(k + 1), 40) : res('fail'); };
        a.onended = () => fin(true); a.onerror = () => fin(false);
        a.play().catch(() => fin(false));
      };
      step(0);
    };
    once(times);
  });
}
function speak(text, times, rate){
  times = times || S.reps; rate = rate || S.rate;
  const tok = ++speakTok;
  if (player) { player.pause(); player = null; }
  const ai = () => playFiles([audioFile(text)], times, rate, tok).then(r => r === 'fail' ? speakTTS(text, times, rate, tok) : r);
  if (S.voice === 'human') { const h = humanFiles(text); return h ? playFiles(h, times, rate, tok).then(r => r === 'fail' ? ai() : r) : ai(); }
  if (S.voice === 'rec') return ai();
  return speakTTS(text, times, rate, tok);
}
function speakTTS(text, times, rate, tok){
  if (!window.speechSynthesis) return Promise.resolve(false);
  speechSynthesis.cancel();
  return new Promise(res => {
    const once = n => {
      if (tok !== speakTok) return res(false);
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; if (voice) u.voice = voice; u.rate = rate;
      let done = false;
      const fin = () => { if (done) return; done = true; n > 1 ? setTimeout(() => once(n - 1), 1100) : res(true); };
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
    };
    setTimeout(() => once(times), 80);
  });
}

/* ---------- Tone trainer: hear one syllable (Ex 1 + Ex 3), name its tone, compare with its other tones ---------- */
const TONE_LABEL = {1:'1 · flat ā', 2:'2 · rising á', 3:'3 · dip ǎ', 4:'4 · falling à'};
const toneOf = it => +it.py.slice(-1);
const baseOf = it => it.py.slice(0, -1);
const TONE_POOL = ITEMS.filter(i => i.sec === 'ex1' || i.sec === 'ex3s');
let T = {n:0, right:0, confuse:{}, cur:null, ans:null};
const toneTones = () => (S.toneMode === '23' ? [2, 3] : [1, 2, 3, 4]);
function toneStats(){
  const mix = Object.entries(T.confuse).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => { const [c, g] = k.split('>'); return `heard ${c === '2' ? '2nd' : c === '3' ? '3rd' : c === '1' ? '1st' : '4th'} as ${g === '2' ? '2nd' : g === '3' ? '3rd' : g === '1' ? '1st' : '4th'} ×${v}`; });
  return T.n ? `<p class="small muted">Score ${T.right}/${T.n}${mix.length ? ' · Mix-ups: ' + mix.join(', ') : ''}</p>` : '';
}
function renderTones(){
  const mode = S.toneMode || 'all';
  $main.innerHTML = `<div class="card"><h2>Tone trainer</h2>
    <p class="small">2nd vs 3rd is the hardest pair for almost every learner. The end of a 3rd tone can rise, so it sounds like a 2nd. Listen to the <b>start</b>:</p>
    <ul class="small rules">
      <li><b>2nd (á):</b> starts in the middle and goes <b>straight up</b>, like asking "huh?". Short and bright.</li>
      <li><b>3rd (ǎ):</b> starts low and <b>drops lower first</b>. The voice goes deep, often a bit creaky, and only lifts at the very end. Longer.</li>
      <li><b>Trick:</b> hum it back. If your voice goes up right away, it's 2nd. If it sinks first, it's 3rd.</li>
    </ul>
    <div class="row" style="margin-top:8px">
      <label><input type="radio" name="tm" value="23" ${mode === '23' ? 'checked' : ''}> Only 2nd vs 3rd (start here)</label>
      <label><input type="radio" name="tm" value="all" ${mode === 'all' ? 'checked' : ''}> All 4 tones</label>
      <button class="btn primary" id="tgo">Start</button>
    </div>${toneStats()}</div>`;
  document.getElementById('tgo').onclick = () => {
    S.toneMode = $main.querySelector('input[name=tm]:checked').value; saveS();
    T = {n:0, right:0, confuse:{}, cur:null, ans:null}; nextTone();
  };
}
function nextTone(){
  const tones = toneTones();
  const pool = TONE_POOL.filter(i => tones.includes(toneOf(i)));
  let it; do { it = pick(pool, 1)[0]; } while (pool.length > 1 && T.cur && it.id === T.cur.id);
  T.cur = it; T.ans = null; drawTone(); speak(it.hz, 1);
}
function siblings(it){
  const byTone = {};
  for (const i of TONE_POOL) if (baseOf(i) === baseOf(it) && !byTone[toneOf(i)]) byTone[toneOf(i)] = i;
  return Object.keys(byTone).sort().map(t => byTone[t]);
}
async function playRow(list){ for (const i of list) { if (tab !== 'tones') return; await speak(i.hz, 1); await new Promise(r => setTimeout(r, 350)); } }
function drawTone(){
  const it = T.cur, c = toneOf(it), sib = siblings(it), answered = T.ans !== null;
  $main.innerHTML = `<div class="card drill">
    <div class="count">Tone trainer · ${S.toneMode === '23' ? '2nd vs 3rd' : 'all 4 tones'}</div>
    <div class="task">Which tone did you hear?</div>
    <div class="row" style="justify-content:center;margin-bottom:12px"><button class="btn" id="rep">▶ Replay</button><button class="btn" id="slow">Slow</button></div>
    <div class="row" style="justify-content:center">${toneTones().map(t => {
      const style = !answered ? '' : t === c ? 'background:var(--ok-bg);border-color:var(--ok)' : t === T.ans ? 'background:var(--bad-bg);border-color:var(--bad)' : '';
      return `<button class="btn" data-t="${t}" style="min-width:120px;${style}">${TONE_LABEL[t]}</button>`; }).join('')}</div>
    ${answered ? `<div class="answer ${T.ans === c ? 'ok' : 'bad'}">
      <div class="verdict">${T.ans === c ? 'Correct' : `It was the ${['', '1st', '2nd', '3rd', '4th'][c]} tone`}</div>
      <div class="py">${show(it)}</div>
      <p class="small">Compare the same syllable in its other tones:</p>
      <div class="row" style="justify-content:center">${sib.map(s => `<button class="btn" data-play="${esc(s.id)}" ${s.id === it.id ? 'style="border-color:var(--accent)"' : ''}>▶ ${show(s)}</button>`).join('')}
        ${sib.length > 1 ? '<button class="btn" id="row">▶ All in a row</button>' : ''}</div>
    </div>` : ''}
    <div class="keys">${answered ? '<kbd>Enter</kbd> next · <kbd>↑</kbd> replay' : `<kbd>${toneTones().join('</kbd> <kbd>')}</kbd> answer · <kbd>↑</kbd> replay`}</div>
    ${toneStats()}
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="tend">End</button></div></div>`;
  document.getElementById('rep').onclick = () => speak(it.hz, 1);
  document.getElementById('slow').onclick = () => speak(it.hz, 1, 0.55);
  document.getElementById('tend').onclick = renderTones;
  $main.querySelectorAll('button[data-t]').forEach(b => b.onclick = () => answerTone(+b.dataset.t));
  $main.querySelectorAll('button[data-play]').forEach(b => b.onclick = () => speak(ITEMS.find(i => i.id === b.dataset.play).hz, 1));
  const row = document.getElementById('row'); if (row) row.onclick = () => playRow(sib);
  keyHandler = e => {
    if (e.key === 'ArrowUp') { e.preventDefault(); speak(it.hz, 1); return; }
    if (!answered && toneTones().includes(+e.key)) { e.preventDefault(); answerTone(+e.key); return; }
    if (answered && e.key === 'Enter') { e.preventDefault(); nextTone(); }
  };
}
function answerTone(t){
  if (T.ans !== null) return;
  const c = toneOf(T.cur); T.ans = t; T.n++;
  if (t === c) T.right++; else T.confuse[c + '>' + t] = (T.confuse[c + '>' + t] || 0) + 1;
  drawTone();
  if (t !== c) setTimeout(() => { const s = siblings(T.cur).filter(i => [c, t].includes(toneOf(i))); if (s.length === 2) playRow(s); }, 400);
}

  const ans = document.getElementById('ans'); ans.value = m.typed[m.i] || ''; ans.focus();
  ans.oninput = () => { m.typed[m.i] = ans.value; };
  document.getElementById('rep').onclick = () => { speak(m.items[m.i].hz, 1); ans.focus(); };
  document.getElementById('nx').onclick = advanceMock;
  document.getElementById('end').onclick = finishMock;
  document.getElementById('pause').onclick = e => { m.paused = !m.paused; e.target.textContent = m.paused ? 'Resume' : 'Pause'; ans.focus(); };
  keyHandler = e => { if (e.key === 'Enter') { e.preventDefault(); advanceMock(); } };
}
async function runMockItem(){
  const m = mock, i = m.i;
  clearInterval(m.timer);
  renderMock('Listen…');
  await speak(m.items[i].hz);
  if (mock !== m || m.i !== i || tab !== 'mock') return;
  m.left = S.gap;
  const st = document.getElementById('st'), bar = document.getElementById('bar');
  const tick = () => { st.textContent = `Write · ${m.left}s`; bar.style.width = (100 * m.left / S.gap) + '%'; };
  tick();
  m.timer = setInterval(() => { if (m.paused) return; m.left--; if (m.left <= 0) advanceMock(); else tick(); }, 1000);
}
function advanceMock(){
  const m = mock; clearInterval(m.timer); stopSpeech();
  const a = document.getElementById('ans'); if (a) m.typed[m.i] = a.value;
  if (++m.i >= m.items.length) finishMock(); else runMockItem();
}
function finishMock(){
  const m = mock; clearInterval(m.timer); stopSpeech(); keyHandler = null;
  document.body.classList.remove('mocking');
  const a = document.getElementById('ans'); if (a && m.i < m.items.length) m.typed[m.i] = a.value;
  m.items = m.items.slice(0, Math.max(1, Math.min(m.items.length, m.i + 1)));
  m.msgs = m.items.map((it, k) => grade(it, m.typed[k] || ''));
  m.marks = m.msgs.map(g => g.ok);
  renderMockResults();
}
function renderMockResults(){
  const m = mock, right = m.marks.filter(v => v === true).length, open = m.marks.filter(v => v === null).length;
  $main.innerHTML = `<div class="card"><h2>Mock result</h2>
    <div class="score">${right}/${m.items.length}</div>
    <p class="muted small">${open ? `${open} item(s) still unmarked: compare your paper and click the mark column. ` : ''}Click any mark to flip it. Click a 汉字 to hear it again. Characters (L1) always need a paper check.</p>
    <table><tr><th>#</th><th>Answer</th><th>汉字</th><th>Typed</th><th>Note</th><th>Mark</th></tr>
    ${m.items.map((it, k) => `<tr><td>${k + 1}</td><td><b>${show(it)}</b></td><td class="hzc" data-k="${k}" style="cursor:pointer">${it.hz}</td><td>${esc(m.typed[k] || '')}</td>
      <td class="small muted">${esc(m.msgs[k].ok === false ? m.msgs[k].msg : '')}</td>
      <td class="mark ${m.marks[k] === true ? 'y' : m.marks[k] === false ? 'n' : ''}" data-k="${k}">${m.marks[k] === true ? '✓' : m.marks[k] === false ? '✗' : '?'}</td></tr>`).join('')}</table>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="save">Send misses to Errors</button><button class="btn" id="again">New mock</button></div></div>`;
  $main.querySelectorAll('td.mark').forEach(td => td.onclick = () => { const k = +td.dataset.k; m.marks[k] = m.marks[k] !== true; renderMockResults(); });
  $main.querySelectorAll('td.hzc').forEach(td => td.onclick = () => speak(m.items[+td.dataset.k].hz, 1));
  document.getElementById('save').onclick = e => {
    m.items.forEach((it, k) => { if (m.marks[k] === false) noteResult(it, false); });
    e.target.textContent = 'Saved ✓'; e.target.disabled = true;
  };
  document.getElementById('again').onclick = () => go('mock');
}

/* ---------- Errors ---------- */
function renderErrors(){
  const rows = Object.entries(bank).map(([id, e]) => ({it:ITEMS.find(i => i.id === id), ...e})).filter(r => r.it).sort((a, b) => b.miss - a.miss);
  $main.innerHTML = `<div class="card"><h2>Error list · ${rows.length}</h2>
    <p class="small muted">An item leaves the list after 2 correct answers in a row. Saved in this browser.</p>
    ${rows.length ? `<table><tr><th>Answer</th><th>汉字</th><th>Section</th><th>Misses</th></tr>
      ${rows.map(r => `<tr data-id="${esc(r.it.id)}" style="cursor:pointer"><td><b>${show(r.it)}</b></td><td>${r.it.hz}</td><td class="small">${SECTIONS.find(s => s.id === r.it.sec).name}</td><td>${r.miss}</td></tr>`).join('')}</table>
      <div class="row" style="margin-top:14px"><button class="btn primary" id="drill">Drill errors</button><button class="btn" id="clear">Clear list</button></div>`
      : '<p>Empty. Run a practice round or a mock test first.</p>'}</div>`;
  $main.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => { const it = ITEMS.find(i => i.id === tr.dataset.id); speak(it.hz, 1); showBook(it.page); });
  const d = document.getElementById('drill');
  if (d) d.onclick = () => startPractice(rows.map(r => r.it), 'Error drill');
  const c = document.getElementById('clear');
  if (c) c.onclick = () => { if (confirm('Clear the whole error list?')) { bank = {}; saveBank(); renderErrors(); } };
}

/* ---------- settings wiring ---------- */
const rate = document.getElementById('rate'), reps = document.getElementById('reps'), sb = document.getElementById('showBook');
rate.value = S.rate; reps.value = S.reps; sb.checked = S.book !== false;
document.body.classList.toggle('nobook', !sb.checked);
rate.oninput = () => { S.rate = +rate.value; saveS(); };
reps.onchange = () => { S.reps = +reps.value; saveS(); };
sb.onchange = () => { S.book = sb.checked; document.body.classList.toggle('nobook', !sb.checked); saveS(); };
document.getElementById('voice').onchange = e => { const v = e.target.value; voice = (v === 'rec' || v === 'human') ? null : voices[+v] || null; S.voice = voice ? voice.name : v; saveS(); speak('你好', 1); };
loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { const had = voices.length; loadVoices(); if (tab === 'study' && !had) renderStudy(); };
showBook(S.page || 12);
saveBank();
const startTab = location.hash.slice(1);
['study', 'practice', 'mock', 'errors'].includes(startTab) ? go(startTab) : renderStudy();
</script>
